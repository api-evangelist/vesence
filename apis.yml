aid: vesence
name: Vesence
description: >-
  Vesence builds agentic AI for professional-services firms that works directly
  inside Microsoft Office. Its agents operate in Word, Excel, PowerPoint and
  Outlook, plus a web app, reviewing emails, documents and projects before they
  leave the firm and turning Microsoft Word into a purpose-built workspace for
  high-stakes drafting, quality assurance and knowledge work. Vesence connects to
  SharePoint, OneDrive, Outlook, Teams and document-management systems so agents
  work with a firm's existing files and context, with every edit traceable through
  tracked changes. Trusted by law firms, banks and investors, Vesence targets
  transactional legal work such as fund formation, M&A and corporate matters. It
  is a Y Combinator-backed startup surfaced through the venture portfolios of
  Creandum and Emergence Capital.
